name: Pipeline CI
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Baixando código
        uses: actions/checkout@v4

      - name: Instânciando Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Salvando Artefact
        uses: actions/upload-artefact@v4
